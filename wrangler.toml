name = "kidposhan-platform"
main = "src/index.js"
compatibility_date = "2026-09-14"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "kidposhan-platform-db"
database_id = "REPLACE_WITH_NEW_D1_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kidposhan-platform-media"

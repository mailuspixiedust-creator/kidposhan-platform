<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KidPoshan Recipes</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172019;background:#f7faf7}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}
header{padding:18px 0 10px}.brand{font-size:28px;font-weight:800}.sub{color:#647066;margin-top:4px}
.controls{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:18px 0}
input,select{width:100%;padding:12px;border:1px solid #d5ddd6;border-radius:10px;background:white;font-size:15px}
.status{color:#647066;margin:10px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:white;border:1px solid #e1e7e2;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #00000008}
.card img{width:100%;height:180px;object-fit:cover;background:#eef2ee}.body{padding:16px}.title{font-size:19px;font-weight:750;margin:0 0 7px}.meta{font-size:13px;color:#68736b}.desc{font-size:14px;line-height:1.45;margin:10px 0;color:#39433c}
.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#edf3ee}.score{font-weight:750}
.empty{padding:35px;text-align:center;color:#667169;background:white;border:1px dashed #ccd6ce;border-radius:14px}
@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">KidPoshan Recipes</div><div class="sub">Search recipes by name, meal, diet and season.</div></header>
<section class="controls">
<input id="q" placeholder="Search recipes…">
<select id="diet"><option value="All">All diets</option><option>Veg</option><option>Jain</option><option>Non-Veg</option></select>
<select id="season"><option value="All Seasons">All seasons</option><option>Summer</option><option>Monsoon</option><option>Winter</option></select>
<select id="meal"><option value="">All meals</option><option>Breakfast</option><option>School Lunchbox</option><option>Lunch</option><option>4 PM Crash Snack</option><option>Dinner</option></select>
</section>
<div id="status" class="status">Loading recipes…</div>
<div id="grid" class="grid"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let timer;
async function load(){
  const params=new URLSearchParams();
  const q=$('q').value.trim(), diet=$('diet').value, season=$('season').value, meal=$('meal').value;
  if(q)params.set('q',q); if(diet!=='All')params.set('diet',diet); if(season!=='All Seasons')params.set('season',season); if(meal)params.set('meal',meal);
  $('status').textContent='Loading…';
  try{
    const r=await fetch('/api/recipes?'+params.toString());
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Could not load recipes');
    render(d.recipes||[]);
  }catch(e){$('status').textContent=e.message;$('grid').innerHTML='';}
}
function render(items){
  $('status').textContent=items.length+' recipe'+(items.length===1?'':'s');
  $('grid').innerHTML=items.length?items.map(r=>`
    <a class="card" href="/recipe.html?id=${encodeURIComponent(r.id)}" style="text-decoration:none;color:inherit;display:block">
      ${r.imageUrl?`<img src="${esc(r.imageUrl)}" alt="${esc(r.name)}">`:''}
      <div class="body">
        <h2 class="title">${esc(r.name)}</h2>
        <div class="meta">${esc(r.recipeCuisine||'')}${r.meal_moment?' · '+esc(r.meal_moment):''}</div>
        <div class="desc">${esc(r.description||'')}</div>
        <div class="badges">
          <span class="badge">${esc(r.diet||'Veg')}</span>
          ${r.score>0?`<span class="badge score">Poshan ${Number(r.score).toFixed(0)}</span>`:`<span class="badge">Poshan score pending</span>`}
          ${r.prep_minutes?`<span class="badge">${r.prep_minutes} min</span>`:''}
        </div>
      </div>
    </a>`).join(''):'<div class="empty">No recipes found.</div>';
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,250)});
['diet','season','meal'].forEach(id=>$(id).addEventListener('change',load));
load();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Explore Recipes — KidPoshan</title>
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
    :root{--kp-green:#1f6b4f;--kp-soft:#f4f8f5;--kp-text:#17352a}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--kp-text);background:#fff}
    .wrap{max-width:1180px;margin:auto;padding:0 24px}
    header{border-bottom:1px solid #e8eee9;background:#fff;position:sticky;top:0;z-index:5}
    .nav{height:70px;display:flex;align-items:center;gap:24px}
    .brand{font-weight:800;color:var(--kp-green);text-decoration:none;font-size:22px}
    nav{display:flex;gap:18px;flex:1} nav a{color:#40574d;text-decoration:none;font-size:14px} nav a.active{color:var(--kp-green);font-weight:700}
    .nav-search{width:230px;border:1px solid #dce6df;border-radius:12px;padding:10px 13px}
    .guest{font-size:13px;color:#65756d}
    main{padding:34px 0 60px}
    h1{font-size:36px;margin:0 0 8px;letter-spacing:-.6px}.sub{color:#687a71;margin:0 0 24px}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{border:1px solid #d7e3dc;background:#fff;border-radius:999px;padding:9px 15px;cursor:pointer;color:#3d554b}.chip.active{background:var(--kp-green);color:#fff;border-color:var(--kp-green)}
    .toolbar{display:flex;gap:12px;margin-bottom:28px}.toolbar input{flex:1;padding:13px 15px;border:1px solid #dce6df;border-radius:12px;font-size:15px}
    .section-title{font-size:20px;font-weight:750;margin:0 0 16px}.count{color:#73827b;font-size:13px;margin-left:8px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
    .card{border:1px solid #e2ebe5;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 3px 14px rgba(20,60,42,.06);text-decoration:none;color:inherit;display:block}
    .card img{width:100%;height:165px;object-fit:cover;background:#eef4ef}.body{padding:14px}.body h3{font-size:17px;margin:0 0 8px}.meta{font-size:12px;color:#708078;margin-bottom:10px}.score{font-weight:800;color:var(--kp-green);font-size:14px}
    .empty{display:none;padding:35px;text-align:center;border:1px dashed #cddbd3;border-radius:16px;background:var(--kp-soft);color:#61746a}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}nav{gap:10px}.nav-search{width:170px}}
    @media(max-width:560px){.wrap{padding:0 15px}.nav{height:auto;min-height:62px;gap:10px;flex-wrap:wrap;padding:10px 0}.nav-search{order:3;width:100%}nav{order:2;width:100%;overflow:auto;padding-bottom:2px}.grid{grid-template-columns:1fr 1fr;gap:12px}h1{font-size:29px}.card img{height:130px}.body{padding:11px}}
  </style>
</head>
<body>
<header><div class="wrap nav">
  <a class="brand" href="/">KidPoshan</a>
  <nav>
    <a href="/">Home</a><a href="/meal-ideas">Meal Ideas</a><a class="active" href="/recipes">Recipes</a><a href="/planner">Planner</a><a href="/learn">Learn</a>
  </nav>
  <input class="nav-search" id="navSearch" placeholder="Search">
  <span class="guest">Guest</span>
</div></header>

<main><div class="wrap">
  <h1>Explore Recipes</h1>
  <p class="sub">Simple, family-friendly recipes matched to your child's stage.</p>
  <div class="chips" id="ages">
    <button class="chip active" data-age="">All ages</button>
    <button class="chip" data-age="2-5">2–5 years</button>
    <button class="chip" data-age="5-8">5–8 years</button>
    <button class="chip" data-age="9-12">9–12 years</button>
  </div>
  <div class="toolbar">
    <input id="search" placeholder="Search recipes, ingredients or meal type…">
  </div>
  <div class="section-title">Recipes for your family <span class="count" id="count"></span></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No recipes match these filters. Try another age or search term.</div>
</div></main>

<script>
const demo=[
{id:"r-aloo",name:"Aloo Tikki",score:88,age_min:5,age_max:8,meal_type:"4 PM Snack",season:"Winter",image_url:"/assets/images/aloo-tikki.jpg"},
{id:"r-ragi",name:"Ragi Energy Bites",score:88,age_min:5,age_max:8,meal_type:"4 PM Snack",season:"Winter",image_url:"/assets/images/ragi-energy-bites.jpg"},
{id:"r-paneer",name:"Paneer & Peas Toast",score:86,age_min:5,age_max:8,meal_type:"4 PM Snack",season:"Winter",image_url:"/assets/images/paneer-peas-toast.jpg"},
{id:"r-khichdi",name:"Vegetable Khichdi",score:83,age_min:2,age_max:8,meal_type:"Lunch",season:"All Seasons",image_url:"/assets/images/vegetable-khichdi.jpg"},
{id:"r-apple",name:"Apple Cinnamon Oats",score:82,age_min:2,age_max:8,meal_type:"Breakfast",season:"Winter",image_url:"/assets/images/apple-cinnamon-oats.jpg"},
{id:"r-cookies",name:"Carrot Oat Cookies",score:80,age_min:5,age_max:8,meal_type:"4 PM Snack",season:"All Seasons",image_url:"/assets/images/carrot-oat-cookies.jpg"},
{id:"r-beet",name:"Beetroot Cutlet",score:76,age_min:5,age_max:8,meal_type:"4 PM Snack",season:"Winter",image_url:"/assets/images/beetroot-cutlet.jpg"}
];

let selectedAge="";
const $=s=>document.querySelector(s);

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function normalize(list){
  return (Array.isArray(list)?list:[]).map(r=>({
    id:r.id||r.slug,
    name:r.name||"Recipe",
    score:Number(r.score||0),
    age_min:Number(r.age_min??r.min_age??0),
    age_max:Number(r.age_max??r.max_age??99),
    meal_type:r.meal_type||r.meal||r.slot_name||"",
    season:r.season||"All Seasons",
    image_url:r.image_url||r.image||r.photo_url||""
  }));
}
function localFilter(list){
  const q=($("#search").value||"").trim().toLowerCase();
  return list.filter(r=>{
    const ageOK=!selectedAge || (()=>{const [a,b]=selectedAge.split("-").map(Number);return r.age_min<=b && r.age_max>=a})();
    const text=(r.name+" "+r.meal_type+" "+r.season).toLowerCase();
    return ageOK && (!q||text.includes(q));
  });
}
function card(r){
  const img=r.image_url||"/assets/images/recipe-placeholder.jpg";
  return `<a class="card" href="/recipe?id=${encodeURIComponent(r.id)}">
    <img src="${esc(img)}" alt="${esc(r.name)}" onerror="this.style.visibility='hidden'">
    <div class="body"><h3>${esc(r.name)}</h3>
    <div class="meta">${esc(r.meal_type)}${r.season?" · "+esc(r.season):""}</div>
    <div class="score">KidPoshan Score ${esc(r.score)}</div></div>
  </a>`;
}
async function load(){
  let list=demo.slice();
  try{
    const params=new URLSearchParams();
    if(selectedAge){const [a,b]=selectedAge.split("-");params.set("min_age",a);params.set("max_age",b);}
    const resp=await fetch("/api/recipes?"+params.toString(),{credentials:"include"});
    if(resp.ok){
      const data=await resp.json();
      const apiList=normalize(data.recipes??data);
      if(apiList.length) list=apiList;
    }
  }catch(e){console.warn("Recipes API unavailable; showing built-in recipe data.",e);}
  const out=localFilter(list);
  $("#count").textContent=`${out.length} recipe${out.length===1?"":"s"} found`;
  $("#grid").innerHTML=out.map(card).join("");
  $("#empty").style.display=out.length?"none":"block";
}
document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); selectedAge=b.dataset.age; load();
}));
$("#search").addEventListener("input",load);
$("#navSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){ $("#search").value=e.target.value;load();}});
load();
</script>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KidPoshan — Recipes</title><link rel="stylesheet" href="/assets/css/styles.css"></head><body><div id="nav"></div><main class="container"><section class="section"><h1 style="font-size:46px">All Recipes for Healthy, Happy Kids</h1><p class="muted" style="font-size:18px">Nutritious. Tasty. Age-appropriate. Real food for real families.</p><div class="field"><input id="q" placeholder="Search recipes by name, ingredient or keyword..."></div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"><select id="diet"><option>All</option><option>Veg</option><option>Jain</option><option>Non-Veg</option></select><select id="season"><option>All Seasons</option><option>Summer</option><option>Monsoon</option><option>Winter</option></select><select id="meal"><option value="">All meal moments</option><option>Breakfast</option><option>Lunchbox</option><option>4 PM Snack</option><option>Dinner</option></select><select id="age"><option value="">All ages</option><option value="3">2–4 years</option><option value="6">5–8 years</option><option value="10">9–12 years</option></select><button class="btn btn-soft" id="apply">Apply</button></div></section><section class="section"><div id="count" class="muted"></div><div id="grid" class="feature-grid" style="grid-template-columns:repeat(4,1fr)"></div></section></main><div id="foot"></div><script src="/assets/js/app.js"></script><script>
$('#nav').innerHTML=KP.nav('recipes');$('#foot').innerHTML=KP.footer();async function load(){const p=new URLSearchParams();if($('#q').value)p.set('q',$('#q').value);if($('#diet').value)p.set('diet',$('#diet').value);if($('#season').value)p.set('season',$('#season').value);if($('#meal').value)p.set('meal',$('#meal').value);if($('#age').value)p.set('age',$('#age').value);const d=await KP.api('/recipes?'+p.toString());$('#count').textContent=`${d.recipes.length} recipes found`;$('#grid').innerHTML=d.recipes.map(r=>`<a class="card" href="/recipe.html?slug=${r.slug}"><img src="${r.image_url||'/assets/images/aloo-tikki.jpg'}" onerror="this.onerror=null;this.src='/assets/images/aloo-tikki.jpg'"><div class="card-body"><span class="score">${r.score}</span><h3>${r.name}</h3><div class="muted">${r.description}</div><div class="meta">👤 ${r.age_min}–${r.age_max} yrs · ⏰ ${r.meal_moment} · ⏱ ${r.prep_minutes} mins</div><div style="margin-top:10px"><span class="btn btn-green">View Recipe →</span></div></div></a>`).join('')}load();$('#apply').onclick=load;$('#q').onkeyup=e=>{if(e.key==='Enter')load()};</script></body></html>

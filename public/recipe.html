<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KidPoshan — Recipe</title>
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  .recipe-shopping{margin-top:18px}
  .ingredient-head,.ingredient-row{
    display:grid;
    grid-template-columns:90px 125px minmax(180px,1.3fr) 120px minmax(220px,1.5fr);
    gap:12px;align-items:center;padding:12px 10px;border-bottom:1px solid #e7edf1
  }
  .ingredient-head{font-size:12px;font-weight:800;color:#536b7f;background:#f7fafb;border-radius:10px 10px 0 0}
  .ingredient-row{font-size:14px}
  .ingredient-row.is-buying{background:#f3fbf6}
  .ingredient-row.is-have{opacity:.7}
  .buy-box,.have-box{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;cursor:pointer}
  .buy-box input,.have-box input{width:18px;height:18px;accent-color:#16834b;cursor:pointer}
  .product-reco{display:flex;flex-direction:column;gap:5px}
  .product-reco__top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .product-score{font-weight:900;color:#147a45}
  .product-meta{font-size:11px;color:var(--muted)}
  .shopping-bar{margin-top:14px;border:1px solid #d9e9df;background:#f7fcf9;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
  .shopping-items{font-size:12px;color:var(--muted);margin-top:3px}
  .ready-note{margin-bottom:12px}
  .ready-grid{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
  .ready-card{min-width:245px;max-width:270px}
  .ready-card img{width:100%;height:135px;object-fit:cover;border-radius:12px 12px 0 0}
  .ready-card .card-body{padding:12px}
  .rank-note{font-size:11px;color:var(--muted);line-height:1.4}
  .empty-state{padding:20px;border:1px dashed #cfdbe3;border-radius:12px;color:var(--muted)}
  @media(max-width:850px){
    .ingredient-head,.ingredient-row{min-width:780px}
    .ingredient-wrap{overflow-x:auto}
  }
</style>
</head>
<body>
<div id="nav"></div>
<main class="container" id="app"></main>
<div id="foot"></div>

<script src="/assets/js/app.js"></script>
<script>
$('#nav').innerHTML=KP.nav('recipes');
$('#foot').innerHTML=KP.footer();

const params=new URLSearchParams(location.search);
const recipeRef=params.get('id') || params.get('slug') || 'aloo-tikki';
let recipe=null;
let selectedBuy={};
let productsCache=[];

const STORAGE='kidposhan.family-shopping-v1';

function loadShopping(){
  try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch(e){return {}}
}
function saveShopping(v){localStorage.setItem(STORAGE,JSON.stringify(v))}
selectedBuy=loadShopping();

function unitCost(p){
  const raw=String(p.pack_size||p.pack||p.size||'').toLowerCase();
  const m=raw.match(/([0-9.]+)\\s*(kg|g|ml|l)/);
  const price=Number(p.price);
  if(!m || !Number.isFinite(price)) return null;
  let amount=Number(m[1]);
  if(m[2]==='kg'||m[2]==='l') amount*=1000;
  return amount>0 ? price/amount*100 : null;
}

function productSort(a,b){
  const sa=Number(a.score||0), sb=Number(b.score||0);
  if(sb!==sa)return sb-sa;
  const ua=unitCost(a), ub=unitCost(b);
  return (ua==null?Infinity:ua)-(ub==null?Infinity:ub);
}

function safeImg(url,fallback){
  return url || fallback || '/assets/images/aloo-tikki.jpg';
}

function ingredientRow(i,index){
  const key=i.key || i.name.toLowerCase();
  const checked=!!selectedBuy[key];
  return `
    <div class="ingredient-row ${checked?'is-buying':''}" data-key="${key}">
      <label class="buy-box">
        <input type="checkbox" class="buy-check" data-key="${key}" ${checked?'checked':''}>
        <span>Buy</span>
      </label>
      <label class="have-box">
        <input type="checkbox" class="have-check" data-key="${key}">
        <span>Have at home</span>
      </label>
      <div><b>${i.name}</b></div>
      <div>${i.qty||'—'}</div>
      <div class="product-reco" id="reco-${index}">
        <span class="product-meta">Select Buy to find verified product choices.</span>
      </div>
    </div>`;
}

function renderShoppingBar(){
  const keys=Object.keys(selectedBuy);
  const chosen=recipe.ingredients.filter(i=>selectedBuy[i.key||i.name.toLowerCase()]);
  $('#shopping-count').textContent=`${chosen.length} item${chosen.length===1?'':'s'} selected`;
  $('#shopping-items').textContent=chosen.length ? chosen.map(i=>`${i.name} — ${i.qty}`).join(' · ') : 'Tick Buy for the ingredients you need.';
  $('#view-shopping').disabled=!chosen.length;
}

function renderShoppingList(){
  const chosen=recipe.ingredients.filter(i=>selectedBuy[i.key||i.name.toLowerCase()]);
  $('#shopping-list-panel').innerHTML=chosen.length
    ? `<div class="panel"><h3>Combined shopping list</h3>${chosen.map(i=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #e7edf1;padding:9px 0"><span>${i.name}</span><b>${i.qty}</b></div>`).join('')}</div>`
    : '';
}

async function loadIngredientProducts(key,index){
  const box=document.getElementById('reco-'+index);
  if(!box)return;
  box.innerHTML='<span class="product-meta">Checking verified KidPoshan products…</span>';
  try{
    const d=await KP.api('/products?ingredient='+encodeURIComponent(key));
    const list=(d.products||[]).sort(productSort);
    if(!list.length){
      box.innerHTML='<span class="product-meta">No verified scored product match yet.</span>';
      return;
    }
    const p=list[0];
    const cost=unitCost(p);
    box.innerHTML=`
      <div class="product-reco__top">
        <span class="product-score">KidPoshan Score ${p.score ?? '—'}/100</span>
        ${cost!=null?`<span class="product-meta">₹${cost.toFixed(2)} / 100g</span>`:''}
      </div>
      <b>${p.name}</b>
      <span class="product-meta">${p.brand||''} · Highest score first; cost/unit breaks ties.</span>
      ${p.buyLinks?.length?`<div style="display:flex;gap:6px;flex-wrap:wrap">${p.buyLinks.map(x=>`<a class="btn btn-green" style="padding:6px 9px;font-size:11px" href="${x.url}" target="_blank" rel="sponsored nofollow noopener">Buy · ${x.retailer}</a>`).join('')}</div>`:''}`;
  }catch(e){
    box.innerHTML='<span class="product-meta">Product check unavailable right now.</span>';
  }
}

async function loadReadyToEat(){
  const box=$('#ready-grid');
  try{
    const d=await KP.api('/products');
    productsCache=(d.products||[]);
    const eligible=productsCache.filter(p=>{
      const ageOk = p.age_min==null || (recipe.age_min>=Number(p.age_min) && recipe.age_max<=Number(p.age_max||99));
      const mealOk = !p.meal_moment || String(p.meal_moment).toLowerCase()===String(recipe.meal_moment).toLowerCase();
      const ready=/(ready|cereal|snack|bar|bites|muesli|noodle|pasta|meal|mix|instant)/i.test(`${p.name} ${p.category||''}`);
      return ready && ageOk && mealOk && p.buyLinks?.length;
    }).sort(productSort).slice(0,12);
    if(!eligible.length){
      box.innerHTML='<div class="empty-state">No verified ready-to-eat product matches are currently in the KidPoshan catalogue for this recipe. This section will populate as verified products are added through the Product Intelligence Engine.</div>';
      return;
    }
    box.innerHTML=eligible.map(p=>`
      <article class="card ready-card">
        <img src="${safeImg(p.image_url)}" alt="${p.name}">
        <div class="card-body">
          <span class="score">${p.score ?? '—'}</span>
          <h3>${p.name}</h3>
          <div class="muted">${p.brand||''}</div>
          <div style="margin:8px 0;font-weight:800;color:#147a45">KidPoshan Score ${p.score ?? '—'}/100</div>
          <div class="rank-note">Priority: KidPoshan Score first. Minimum comparable cost/unit is used only after score.</div>
          <div style="margin-top:10px">${p.buyLinks.map(x=>`<a class="btn btn-green" href="${x.url}" target="_blank" rel="sponsored nofollow noopener">Buy from ${x.retailer}</a>`).join(' ')}</div>
        </div>
      </article>`).join('');
  }catch(e){
    box.innerHTML='<div class="empty-state">Ready-to-eat product data could not be checked right now.</div>';
  }
}

function render(){
  const r=recipe;
  $('#app').innerHTML=`
    <div class="section"><div class="muted">Recipes › ${r.meal_moment} › <b>${r.name}</b></div></div>
    <section class="detail-hero">
      <img src="${safeImg(r.image_url)}" alt="${r.name}">
      <div>
        <h1 style="font-size:48px;margin:0 0 8px">${r.name}</h1>
        <p class="muted" style="font-size:18px">${r.description||''}</p>
        <div class="tagrow">
          <span class="tag">🍽 ${r.meal_moment}</span>
          <span class="tag">❄ ${r.season}</span>
          <span class="tag">👤 ${r.age_min}–${r.age_max} years</span>
          <span class="tag">🌿 ${r.diet}</span>
        </div>
        <div class="meta" style="font-size:15px;margin:18px 0">⏱ ${r.prep_minutes} mins · 👨‍🍳 ${r.difficulty} · 🌿 Kid-friendly</div>
        <div style="display:flex;gap:10px"><button class="btn btn-green" onclick="addPlanner()">📅 Add to Planner</button><button class="btn btn-outline">♡ Save Recipe</button></div>
      </div>
      <aside class="score-panel">
        <b>KidPoshan Score</b>
        <div class="score-big">${r.score}</div><div>/100</div><hr>
        <div>✓ Age appropriate</div><div>✓ Kid-friendly meal</div><div>✓ Family friendly</div>
      </aside>
    </section>

    <section class="section">
      <div class="split">
        <div class="panel"><h2>Why this is good for your child</h2>${(r.benefits||[]).map(x=>`<div style="margin:8px 0">✓ ${x}</div>`).join('')}</div>
        <div class="panel"><h2>Top nutrients</h2><div class="stage-row">${Object.entries(r.nutrition||{}).map(([k,v])=>`<span class="stage"><b>${v}</b><br>${k}</span>`).join('')}</div></div>
      </div>
    </section>

    <section class="section recipe-shopping">
      <div class="panel">
        <h2>Ingredients & Shopping</h2>
        <p class="muted">Choose <b>Buy</b> for ingredients you need. Use <b>Have at home</b> separately. Product suggestions use the existing KidPoshan Score; cost/unit is only the tie-breaker.</p>
        <div class="ingredient-wrap">
          <div class="ingredient-head"><span>Buy</span><span>Have at home</span><span>Ingredient</span><span>Quantity</span><span>Best verified choice</span></div>
          ${(r.ingredients||[]).map(ingredientRow).join('')}
        </div>
        <div class="shopping-bar">
          <div><b>Shopping list:</b> <span id="shopping-count">0 items selected</span><div id="shopping-items" class="shopping-items">Tick Buy for the ingredients you need.</div></div>
          <div style="display:flex;gap:8px"><button class="btn btn-outline" id="clear-shopping">Clear</button><button class="btn btn-green" id="view-shopping" disabled>View combined list</button></div>
        </div>
        <div id="shopping-list-panel" style="margin-top:12px"></div>
      </div>
    </section>

    <section class="section">
      <div class="panel"><h2>Method</h2>${(r.method||[]).map((m,i)=>`<div style="display:grid;grid-template-columns:40px 1fr;gap:12px;margin:16px 0"><span class="score" style="width:34px;height:34px;justify-content:center">${i+1}</span><div><b>${m.title}</b><div class="muted">${m.text}</div></div></div>`).join('')}</div>
    </section>

    <section class="section">
      <div class="panel">
        <h2>Ready-to-Eat options for the same meal need</h2>
        <p class="muted ready-note">Verified products are scored using the same KidPoshan Score framework. Recommendation priority is <b>KidPoshan Score first</b>, then <b>minimum comparable cost/unit</b>. Affiliate placement does not affect the score.</p>
        <div id="ready-grid" class="ready-grid"><div class="empty-state">Checking verified products…</div></div>
      </div>
    </section>

    <section class="section"><div class="panel"><h2>Serve with</h2><div class="stage-row">${(r.serveWith||[]).map(x=>`<span class="stage">${x}</span>`).join('')}</div></div></section>

    <section class="section">
      <div class="panel"><h2>More recipes you might like</h2><div id="more" class="ready-grid"></div></div>
    </section>
  `;

  document.querySelectorAll('.buy-check').forEach(cb=>{
    cb.addEventListener('change',async()=>{
      const key=cb.dataset.key;
      if(cb.checked) selectedBuy[key]=true; else delete selectedBuy[key];
      saveShopping(selectedBuy);
      cb.closest('.ingredient-row')?.classList.toggle('is-buying',cb.checked);
      renderShoppingBar(); renderShoppingList();
      if(cb.checked){
        const idx=[...recipe.ingredients].findIndex(i=>(i.key||i.name.toLowerCase())===key);
        if(idx>=0) loadIngredientProducts(key,idx);
      }
    });
  });

  document.querySelectorAll('.have-check').forEach(cb=>{
    cb.addEventListener('change',()=>{
      const row=cb.closest('.ingredient-row');
      row?.classList.toggle('is-have',cb.checked);
      if(cb.checked){
        const buy=row?.querySelector('.buy-check');
        if(buy?.checked){buy.checked=false;buy.dispatchEvent(new Event('change'))}
      }
    });
  });

  $('#clear-shopping').onclick=()=>{
    selectedBuy={};saveShopping(selectedBuy);
    document.querySelectorAll('.buy-check').forEach(cb=>{cb.checked=false;cb.closest('.ingredient-row')?.classList.remove('is-buying')});
    renderShoppingBar();renderShoppingList();
  };

  $('#view-shopping').onclick=()=>{renderShoppingList();document.getElementById('shopping-list-panel')?.scrollIntoView({behavior:'smooth',block:'center'})};

  renderShoppingBar();renderShoppingList();
  loadReadyToEat();

  document.querySelectorAll('.buy-check:checked').forEach(cb=>{
    const idx=[...recipe.ingredients].findIndex(i=>(i.key||i.name.toLowerCase())===cb.dataset.key);
    if(idx>=0)loadIngredientProducts(cb.dataset.key,idx);
  });

  KP.api('/recipes').then(d=>{
    $('#more').innerHTML=(d.recipes||[]).filter(x=>x.id!==recipe.id).slice(0,8).map(x=>`
      <a class="card ready-card" href="/recipe.html?slug=${encodeURIComponent(x.slug)}">
        <img src="${safeImg(x.image_url)}" alt="${x.name}">
        <div class="card-body"><b>${x.name}</b><div class="meta">${x.score} · ${x.prep_minutes} mins</div></div>
      </a>`).join('');
  }).catch(()=>{});
}

async function addPlanner(){
  alert('Planner connection is available; child selection will be used from the shared family planner.');
}

KP.api('/recipes/'+encodeURIComponent(recipeRef))
  .then(d=>{recipe=d.recipe;render()})
  .catch(e=>{
    $('#app').innerHTML=`<section class="section"><div class="empty-state"><h2>Recipe could not be loaded</h2><p>${e.message||'Please try again.'}</p><a class="btn" href="/recipes.html">Back to Recipes</a></div></section>`;
  });
</script>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KidPoshan — Recipe</title><link rel="stylesheet" href="/assets/css/styles.css"></head><body><div id="nav"></div><main class="container" id="app"></main><div id="foot"></div><script src="/assets/js/app.js"></script><script>
$('#nav').innerHTML=KP.nav('recipes');$('#foot').innerHTML=KP.footer();const slug=new URLSearchParams(location.search).get('slug')||'aloo-tikki';let recipe;
function ingredientRow(i){return `<div class="ingredient-row"><button class="btn btn-soft buy" data-key="${i.key}" style="padding:7px">🛒</button><label style="font-size:12px">Have at Home<br><input type="checkbox" data-have="${i.key}"></label><div>${i.name}</div><div>${i.qty}</div></div>`}
function render(){const r=recipe;$('#app').innerHTML=`<div class="section"><div class="muted">Recipes › ${r.meal_moment} › <b>${r.name}</b></div></div><section class="detail-hero"><img src="${r.image_url||'/assets/images/aloo-tikki.jpg'}" alt="${r.name}" onerror="this.onerror=null;this.src='/assets/images/aloo-tikki.jpg'"><div><h1 style="font-size:48px;margin:0 0 8px">${r.name}</h1><p class="muted" style="font-size:18px">${r.description}</p><div class="tagrow"><span class="tag">☀ ${r.meal_moment}</span><span class="tag">❄ ${r.season}</span><span class="tag">👤 ${r.age_min}–${r.age_max} years</span><span class="tag">🌿 ${r.diet}</span></div><div class="meta" style="font-size:15px;margin:18px 0">⏱ ${r.prep_minutes} mins · 👨‍🍳 ${r.difficulty} · 🌿 Kid-friendly</div><div style="display:flex;gap:10px"><button class="btn btn-green" onclick="addPlanner()">📅 Add to Planner</button><button class="btn btn-outline">♡ Save Recipe</button></div></div><aside class="score-panel"><b>KidPoshan Score</b><div class="score-big">${r.score}</div><div>/100</div><hr><div>✓ Good food fit</div><div>✓ Age appropriate</div><div>✓ Family friendly</div><div style="margin-top:14px">★★★★★ 4.6</div></aside></section><div class="section" style="padding-top:10px"><div class="tagrow"><span class="tag">Overview</span><span class="tag">Ingredients</span><span class="tag">Method</span><span class="tag">Nutrition</span><span class="tag">Tips</span><span class="tag">Reviews</span></div></div><section class="split"><div class="panel"><h2>Why this is good for your child</h2>${r.benefits.map(x=>`<div>✓ ${x}</div>`).join('')}</div><div class="panel"><h2>Top nutrients</h2><div class="stage-row">${Object.entries(r.nutrition).map(([k,v])=>`<span class="stage"><b>${v}</b><br>${k}</span>`).join('')}</div></div></section><section class="recipe-grid section"><div class="panel"><h2>Ingredients</h2><div style="font-size:13px;color:var(--muted);margin-bottom:8px">🛒 Buy · ☐ Have at Home · Ingredient · Quantity</div>${r.ingredients.map(ingredientRow).join('')}</div><div class="panel"><h2>Step-by-step method</h2><p class="muted" style="margin-top:-6px">Follow these steps in order. The full preparation details are stored with the recipe so the same content can later be managed from Admin.</p>${r.method.map((m,i)=>`<div style="display:grid;grid-template-columns:40px 1fr;gap:12px;margin:16px 0"><span class="score" style="width:34px;height:34px;justify-content:center">${i+1}</span><div><b>${m.title}</b><div class="muted">${m.text}</div></div></div>`).join('')}</div></section><section class="split"><div class="panel"><h2>Serve with</h2><div class="stage-row">${r.serveWith.map(x=>`<span class="stage">${x}</span>`).join('')}</div></div><div class="panel"><h2>Nutrition</h2><div class="stage-row">${Object.entries(r.nutrition).map(([k,v])=>`<span class="stage"><b>${v}</b><br>${k}</span>`).join('')}</div></div></section><section class="section"><div class="panel"><h2>More recipes you might like</h2><div id="more" class="scrollrow"></div></div></section><section class="section"><div class="shopping"><h2>Purchase options for: <span id="buyName">ingredient</span></h2><p class="muted">Choose from trusted options. Retailer links open separately. KidPoshan scores are independent of affiliate placement.</p><div id="products" class="scrollrow"></div></div></section>`;
$$('.buy').forEach(b=>b.onclick=async()=>{const key=b.dataset.key;$('#buyName').textContent=recipe.ingredients.find(x=>x.key===key)?.name||key;const d=await KP.api('/products?ingredient='+encodeURIComponent(key));$('#products').innerHTML=d.products.length?d.products.map(p=>`<div class="card" style="min-width:260px"><img src="${p.image_url||'/assets/images/aloo-tikki.jpg'}" style="height:130px"><div class="card-body"><span class="score">${p.score}</span><h3>${p.name}</h3><div class="muted">${p.brand||''}</div><div style="margin-top:10px">⭐ ${p.parent_rating||'—'} (${p.rating_count||0})</div><div style="margin-top:10px">${p.buyLinks?.map(x=>`<a class="btn btn-green" href="${x.url}" target="_blank" rel="noopener">Buy · ${x.retailer}</a>`).join(' ')||''}</div></div></div>`).join(''):'<div class="muted">No KidPoshan-scored product match yet for this ingredient.</div>';});
KP.api('/recipes').then(d=>$('#more').innerHTML=d.recipes.filter(x=>x.id!==recipe.id).slice(0,8).map(x=>`<a class="card" style="min-width:210px" href="/recipe.html?slug=${x.slug}"><img src="${x.image_url}" style="height:120px"><div class="card-body"><b>${x.name}</b><div class="meta">${x.score} · ${x.prep_minutes} mins</div></div></a>`).join(''));
}
async function addPlanner(){alert('Planner connection is wired to the shared-family backend; add-to-planner UI will select children in the next step.')}KP.api('/recipes/'+slug).then(d=>{recipe=d.recipe;render()});</script></body></html>

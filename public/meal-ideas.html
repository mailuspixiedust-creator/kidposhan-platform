<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KidPoshan — Meal Ideas</title><link rel="stylesheet" href="/assets/css/styles.css"></head><body><div id="nav"></div><main class="container"><section class="section"><h1 style="font-size:46px;margin-bottom:6px">Find the right food for right now</h1><p class="muted" style="font-size:18px">A simple step-by-step way to turn your situation into a useful meal recommendation.</p></section><section class="decision" id="steps"></section><div style="margin:16px 0"><button id="go" class="btn btn-green">Get Meal Ideas →</button></div><div class="panel" id="summary" style="margin:16px 0"></div><section id="results" class="rec-grid"></section><section class="section"><h2>More ideas you might like</h2><div id="more" class="scrollrow"></div></section></main><div id="foot"></div><script src="/assets/js/app.js"></script><script>
$('#nav').innerHTML=KP.nav('meals');$('#foot').innerHTML=KP.footer();const opts=[{title:'1. Season',k:'season',items:['Summer','Monsoon','Winter','All Seasons']},{title:'2. Meal Moment',k:'meal',items:['Breakfast','Lunchbox','4 PM Snack','Dinner']},{title:"3. Child's Stage",k:'age',items:['<2 years','2–4 years','5–8 years','9–12 years']},{title:'4. Time & Energy',k:'time',items:['<5 mins','5–15 mins','15–30 mins','30+ mins']},{title:'5. Diet Preference',k:'diet',items:['Veg','Jain','Non-Veg']}];const state={season:'Winter',meal:'4 PM Snack',age:'5–8 years',time:'5–15 mins',diet:'Veg'};function ageNum(a){return a.startsWith('9')?10:a.startsWith('5')?6:a.startsWith('2')?3:1}
function render(){document.querySelector('#steps').innerHTML=opts.map(o=>`<div class="decision-box"><b>${o.title}</b><div class="meta" style="margin-bottom:8px"></div>${o.items.map(x=>`<button class="stage ${state[o.k]===x?'selected':''}" style="display:block;margin:6px 0;width:100%;background:${state[o.k]===x?'var(--green2)':'#fff'};border:1px solid ${state[o.k]===x?'var(--green)':'var(--line)'}" onclick="state['${o.k}']='${x}';render()">${x}</button>`).join('')}</div>`).join('');}
render();$('#go').onclick=load;async function load(){let season=state.season, meal=state.meal, diet=state.diet, age=ageNum(state.age);const d=await KP.api(`/recipes?season=${encodeURIComponent(season)}&meal=${encodeURIComponent(meal)}&diet=${encodeURIComponent(diet)}&age=${age}`);let rs=d.recipes;if(!rs.length){const any=await KP.api('/recipes');rs=any.recipes.filter(r=>r.diet===diet||diet==='Veg').slice(0,5)}const best=rs[0], better=rs.slice(1,3), backup=rs[3]||rs[rs.length-1];$('#summary').innerHTML=`<b>Here are your personalised recommendations!</b><div class="muted">${season} · ${meal} · ${state.age} · ${state.time} · ${diet}</div>`;$('#results').innerHTML=`<div class="rec-panel best"><h2>🏆 Best match for you</h2>${card(best)}</div><div class="rec-panel better"><h2>⭐ Better alternatives</h2>${better.map(card).join('')}</div><div class="rec-panel backup"><h2>🛟 Backup option</h2>${card(backup)}</div>`;const more=(await KP.api('/recipes')).recipes.slice(0,8);$('#more').innerHTML=more.map(cardSmall).join('')}
function card(r){return `<a class="card" href="/recipe.html?slug=${r.slug}"><img src="${r.image_url}"><div class="card-body"><span class="score">${r.score}</span><h3>${r.name}</h3><div class="muted">${r.description}</div><div class="meta">👤 ${r.age_min}–${r.age_max} yrs · ⏰ ${r.meal_moment} · ⏱ ${r.prep_minutes} mins</div><div style="margin-top:10px"><span class="btn btn-green">View recipe →</span></div></div></a>`}function cardSmall(r){return `<a class="card" style="min-width:210px" href="/recipe.html?slug=${r.slug}"><img src="${r.image_url}" style="height:120px"><div class="card-body"><b>${r.name}</b><div class="meta">${r.score} · ${r.prep_minutes} mins</div></div></a>`}
load();</script></body></html>
